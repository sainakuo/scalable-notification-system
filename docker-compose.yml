
services:
  postgres:
    image: postgres:16
    container_name: sns_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sns_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sns_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sns_redis
    ports:
      - "6379:6379"

  grpc-sender:
    build:
      context: .
      dockerfile: Dockerfile.grpc-sender
    container_name: sns_grpc_sender
    ports:
      - "50051:50051"
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis: 
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sns_api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: sns_db
      REDIS_ADDR: redis:6379
      API_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate: 
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sns_worker
    ports:
      - "9090:9090"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: sns_db
      REDIS_ADDR: redis:6379
      GRPC_SENDER_ADDR: grpc-sender:50051
    depends_on:
      postgres: 
        condition: service_healthy
      redis:
        condition: service_started
      grpc-sender:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  migrate:
    image: postgres:16
    container_name: sns_migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    environment:
      PGPASSWORD: postgres
    command: >
      sh -c "
      psql -h postgres -U postgres -d sns_db -f /migrations/001_create_tasks_table.sql &&
      psql -h postgres -U postgres -d sns_db -f /migrations/002_add_task_constraints_and_indexes.sql
      "

volumes:
  postgres_data: